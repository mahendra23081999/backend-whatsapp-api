steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wapi:$COMMIT_SHA'
      - '.'

  # Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/wapi:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wapi'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wapi:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      # Baileys keeps live WebSocket sessions in memory: keep exactly one
      # always-on instance with CPU allocated outside requests, or QR pairing fails
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--session-affinity'

images:
  - 'gcr.io/$PROJECT_ID/wapi:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
